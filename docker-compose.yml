services:
  kafka:
    image: apache/kafka:latest
    container_name: telecom-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL is used by ksqldb-server inside Docker; PLAINTEXT is used by PySpark/Python on host Mac
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  ksqldb-server:
    image: confluentinc/ksqldb-server:0.29.0
    container_name: telecom-ksqldb-server
    depends_on:
      - kafka
    ports:
      - "8088:8088"
    environment:
      KSQL_LISTENERS: http://0.0.0.0:8088
      KSQL_BOOTSTRAP_SERVERS: kafka:29092
      KSQL_KSQL_SERVICE_ID: telecom_xdi_ksql_
      KSQL_KSQL_LOGGING_PROCESSING_STREAM_AUTO_CREATE: "true"
      KSQL_KSQL_LOGGING_PROCESSING_TOPIC_AUTO_CREATE: "true"

  ksqldb-cli:
    image: confluentinc/ksqldb-cli:0.29.0
    container_name: telecom-ksqldb-cli
    depends_on:
      - ksqldb-server
    environment:
      KSQL_OPTS: "-Djava.util.logging.config.file=/dev/null"
    entrypoint: /bin/sh
    tty: true

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: telecom-seaweedfs
    ports:
      - "8333:8333" # S3 API port (used by PySpark + Delta Lake via s3a://)
      - "8888:8888" # Filer Web UI (browse buckets, parquet files & _delta_log)
      - "9333:9333" # Master status port
    command: "server -s3 -filer -dir=/data -volume.max=100"
    volumes:
      - seaweedfs_data:/data

volumes:
  seaweedfs_data:
